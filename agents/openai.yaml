interface:
  display_name: "jhosephe"
  short_description: "Interfaces monocromáticas táteis em Light e Black/Dark com transparência e blur contínuos"
  default_prompt: "Use $jhosephe para construir uma interface React monocromática acromática nos temas Light e Black/Dark, com Geist Variable em toda a hierarquia, transparência (0–85%) e desfoque (0–32px) contínuos de superfície (--jh-surface-alpha e --jh-surface-blur) preservando sombras externas, texto e ícones nítidos, botões táteis liquid glass, controles de vidro rígido com emissores OKLCH confinados em cavidades, scrollbars unificadas, sem metal e com estados acessíveis."
policy:
  allow_implicit_invocation: true
