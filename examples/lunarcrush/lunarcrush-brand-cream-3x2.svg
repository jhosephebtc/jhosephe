      <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="17" stitchTiles="stitch" result="grain"/>
      <feColorMatrix type="matrix" in="grain"
        values="0 0 0 0 0.22
                0 0 0 0 0.2
                0 0 0 0 0.16
                0 0 0 0.055 0"/>
    </filter>
    <filter id="paper-brand-cream-fiber" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
