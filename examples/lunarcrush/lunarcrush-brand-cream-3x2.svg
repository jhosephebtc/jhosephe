  .t-num { font-variant-numeric: tabular-nums; }

      .scan-rule {
        stroke-dasharray: 40 240;
        stroke-dashoffset: 0;
        animation: rule-glide 8s linear infinite;
      }
      @keyframes rule-glide {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -280; }
      }
      .mark-breathe { transform-origin: 810px 330px; animation: mark-b 8s ease-in-out infinite; }
      @keyframes mark-b { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    </style>
    
