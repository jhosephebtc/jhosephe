<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="A React component library in glass, light, and tactile detail. Explore, customize, and install." />
    <title>jhosephe — components to feel</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('jhosephe-theme') === 'dark') {
            document.documentElement.dataset.jhTheme = 'dark';
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = '#0a0a0a';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
