<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Stacking DAO Tactile Dial — Stake BTC and STX on Stacks">
  <title>Stacking DAO — Tactile Dial Animation</title>
  <desc>Minimalist Stacking DAO SVG animation featuring the Jhosephe UI Tactile Dial in Dark Green with Fluor Green (#6FF26F) emissive light, Aktiv Grotesk Bold Extended and Inter typography.</desc>

  <defs>
    <style>
      @font-face {
        font-family: 'Aktiv Grotesk Ex';
        src: url('./Aktiv_Grotesk_Ex_Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');

      .font-aktiv {
        font-family: 'Aktiv Grotesk Ex', 'Aktiv Grotesk', 'Inter', system-ui, sans-serif;
        font-weight: 700;
      }
      .font-inter {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      /* 12s smooth choreography across all 4 detent stops (-135deg to +135deg) */
      @keyframes dial-rotate {
        0%, 20%   { transform: rotate(-135deg); }
        25%, 45%  { transform: rotate(-45deg); }
        50%, 70%  { transform: rotate(45deg); }
        75%, 93%  { transform: rotate(135deg); }
        100%      { transform: rotate(-135deg); }
      }

      @keyframes arc-sweep {
        0%, 20%   { stroke-dasharray: 1.4 100; }
        25%, 45%  { stroke-dasharray: 33.33 100; }
        50%, 70%  { stroke-dasharray: 66.67 100; }
        75%, 93%  { stroke-dasharray: 100 100; }
        100%      { stroke-dasharray: 1.4 100; }
      }

      @keyframes text-0 {
        0%, 20%   { opacity: 1; }
        24%, 96%  { opacity: 0; }
        100%      { opacity: 1; }
      }
      @keyframes text-1 {
        0%, 21%   { opacity: 0; }
        25%, 45%  { opacity: 1; }
        49%, 100% { opacity: 0; }
      }
      @keyframes text-2 {
        0%, 46%   { opacity: 0; }
        50%, 70%  { opacity: 1; }
        74%, 100% { opacity: 0; }
      }
      @keyframes text-3 {
        0%, 71%   { opacity: 0; }
        75%, 93%  { opacity: 1; }
        97%, 100% { opacity: 0; }
      }

      .dial-indicator {
        animation: dial-rotate 12s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 0px 0px;
      }

      .dial-arc-active {
        animation: arc-sweep 12s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        filter:
          drop-shadow(0 0 3px rgba(111, 242, 111, 0.85))
          drop-shadow(0 0 10px rgba(111, 242, 111, 0.45))
          drop-shadow(0 0 22px rgba(111, 242, 111, 0.22));
      }

      .dial-knob-shadow {
        filter:
          drop-shadow(0 5px 4px rgba(2, 6, 5, 0.92))
          drop-shadow(2px 16px 24px rgba(0, 0, 0, 0.88));
      }

      .dial-led-glow {
        filter:
          drop-shadow(0 0 3px rgba(170, 255, 170, 0.95))
          drop-shadow(0 0 9px rgba(111, 242, 111, 0.78))
          drop-shadow(0 0 20px rgba(111, 242, 111, 0.42));
      }

      .status-dot-glow {
        filter:
          drop-shadow(0 0 3px rgba(111, 242, 111, 0.9))
          drop-shadow(0 0 10px rgba(111, 242, 111, 0.55));
      }

      .ambient-glow {
        filter: blur(110px);
      }

      .step-0 { animation: text-0 12s ease-in-out infinite; }
      .step-1 { animation: text-1 12s ease-in-out infinite; }
      .step-2 { animation: text-2 12s ease-in-out infinite; }
      .step-3 { animation: text-3 12s ease-in-out infinite; }

      .detent-active {
        filter: drop-shadow(0 0 8px rgba(111, 242, 111, 0.55));
      }
    </style>

    <!-- .jh-dial__bed (Ultra-dark green-obsidian recessed well) -->
    <radialGradient id="dial-bed" cx="50%" cy="54%" r="54%">
      <stop offset="0%" stop-color="#060b09" />
      <stop offset="78%" stop-color="#09120f" />
      <stop offset="100%" stop-color="#0c1814" />
    </radialGradient>

    <!-- Subtle top inner shadow & bottom lip highlight on recessed bed -->
    <linearGradient id="bed-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020504" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#060c0a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f5f5ef" stop-opacity="0.035" />
    </linearGradient>

    <!-- .jh-dial__knob (Dark green-obsidian machined body, matching #101010 -> #0a0a0a) -->
    <linearGradient id="dial-knob-body" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#15241f" />
      <stop offset="48%" stop-color="#0b1411" />
      <stop offset="80%" stop-color="#101c18" />
      <stop offset="100%" stop-color="#09110e" />
    </linearGradient>

    <!-- .jh-dial__top (Dark green-obsidian concave cap, matching #111111 -> #0b0b0b -> #080808) -->
    <radialGradient id="dial-top-cap" cx="30%" cy="15%" r="78%">
      <stop offset="0%" stop-color="#162621" />
      <stop offset="55%" stop-color="#0d1814" />
      <stop offset="100%" stop-color="#080f0d" />
    </radialGradient>

    <!-- Top bevel highlight -->
    <linearGradient id="knob-top-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5ef" stop-opacity="0.09" />
      <stop offset="35%" stop-color="#f5f5ef" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>

    <!-- Fluor Green Emissive Arc -->
    <linearGradient id="fluor-arc" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#4de25e" />
      <stop offset="55%" stop-color="#6FF26F" />
      <stop offset="100%" stop-color="#a2ffa2" />
    </linearGradient>

    <!-- Emissive LED Pill Core -->
    <linearGradient id="led-pill-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8ffb8" />
      <stop offset="50%" stop-color="#6FF26F" />
      <stop offset="100%" stop-color="#5ae05a" />
    </linearGradient>
  </defs>

  <!-- Almost-Black Canvas (#070c0a) -->
  <rect width="1200" height="675" fill="#070c0a" />

  <!-- Smooth GPU-blurred Ambient Dark Green Light Behind Dial (zero banding) -->
  <circle cx="885" cy="338" r="190" fill="#1c3830" opacity="0.85" class="ambient-glow" />
  <circle cx="885" cy="338" r="95" fill="#6FF26F" opacity="0.12" class="ambient-glow" />

  <!-- ==================== LEFT: CLEAN BRAND & TYPOGRAPHY ==================== -->
  <g transform="translate(88, 128)">
    <!-- Stacking DAO Logotype -->
    <g transform="translate(0, 0)">
      <g transform="translate(0, 2) scale(0.68)">
        <path d="M 14 0 L 42 0 C 50 0 56 3.5 60 10 L 49 16 C 46.5 12 43.5 10.5 39 10.5 L 14 10.5 Z" fill="#6FF26F" />
        <path d="M 2 10.5 L 14 10.5 C 14 18 20 22 28 22 L 38 22 C 51 22 60 30 60 42 L 48 42 C 48 35.5 43.5 32.5 36 32.5 L 26 32.5 C 12 32.5 2 24.5 2 10.5 Z" fill="#6FF26F" />
        <path d="M 0 44 L 11 38 C 13.5 42 16.5 43.5 21 43.5 L 36 43.5 L 36 54 L 18 54 C 10 54 4 50.5 0 44 Z" fill="#6FF26F" />
      </g>
      <text x="54" y="31" class="font-aktiv" font-size="22" letter-spacing="1.2" fill="#f5f5ef">STACKING<tspan dy="-8" font-size="10.5" fill="#6FF26F" letter-spacing="0.8">DAO</tspan></text>
    </g>

    <!-- Headline (Aktiv Grotesk Bold Extended) -->
    <text x="0" y="132" class="font-aktiv" font-size="46" letter-spacing="-0.8" fill="#f5f5ef">Stake <tspan fill="#6FF26F">BTC</tspan> and <tspan fill="#6FF26F">STX</tspan></text>
    <text x="0" y="186" class="font-aktiv" font-size="46" letter-spacing="-0.8" fill="#f5f5ef">on Stacks</text>

    <!-- Subtitle (Inter) -->
    <text x="0" y="236" class="font-inter" font-size="18" font-weight="400" fill="#f5f5ef" fill-opacity="0.78">
      Stacking DAO is the hub for staking on Stacks.
    </text>

    <!-- Minimal Synchronized Status Line -->
    <g transform="translate(0, 344)">
      <circle cx="5" cy="-5" r="3.5" fill="#6FF26F" class="status-dot-glow" />

      <g class="step-0">
        <text x="20" y="0" class="font-aktiv" font-size="16" fill="#f5f5ef">stBTC</text>
        <text x="96" y="0" class="font-inter" font-size="15" font-weight="400" fill="#f5f5ef" fill-opacity="0.64">Auto-compounding Bitcoin yield · Liquid in DeFi</text>
      </g>
      <g class="step-1">
        <text x="20" y="0" class="font-aktiv" font-size="16" fill="#f5f5ef">stSTX</text>
        <text x="96" y="0" class="font-inter" font-size="15" font-weight="400" fill="#f5f5ef" fill-opacity="0.64">Liquid STX stacking · Auto-compounding rewards</text>
      </g>
      <g class="step-2">
        <text x="20" y="0" class="font-aktiv" font-size="16" fill="#f5f5ef">stSTXbtc</text>
        <text x="128" y="0" class="font-inter" font-size="15" font-weight="400" fill="#f5f5ef" fill-opacity="0.64">Stake STX and earn direct BTC rewards</text>
      </g>
      <g class="step-3">
        <text x="20" y="0" class="font-aktiv" font-size="16" fill="#f5f5ef">Native STX</text>
        <text x="150" y="0" class="font-inter" font-size="15" font-weight="400" fill="#f5f5ef" fill-opacity="0.64">Direct BTC rewards · Zero smart-contract risk</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT: NATIVE 1:1 JHOSEPHE UI TACTILE DIAL ==================== -->
  <g transform="translate(885, 338)">
    <!-- Detent Labels aligned at -135°, -45°, +45°, +135° -->
    <g class="font-inter" font-size="12" font-weight="500">
      <text x="-142" y="138" text-anchor="middle" fill="#f5f5ef" fill-opacity="0.34">stBTC</text>
      <text x="-142" y="138" text-anchor="middle" fill="#6FF26F" class="step-0 detent-active">stBTC</text>

      <text x="-142" y="-134" text-anchor="middle" fill="#f5f5ef" fill-opacity="0.34">stSTX</text>
      <text x="-142" y="-134" text-anchor="middle" fill="#6FF26F" class="step-1 detent-active">stSTX</text>

      <text x="142" y="-134" text-anchor="middle" fill="#f5f5ef" fill-opacity="0.34">stSTXbtc</text>
      <text x="142" y="-134" text-anchor="middle" fill="#6FF26F" class="step-2 detent-active">stSTXbtc</text>

      <text x="142" y="138" text-anchor="middle" fill="#f5f5ef" fill-opacity="0.34">Native</text>
      <text x="142" y="138" text-anchor="middle" fill="#6FF26F" class="step-3 detent-active">Native</text>
    </g>

    <!-- Datum Marks (-135, 0, +135) -->
    <g stroke="#f5f5ef" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round">
      <path d="M 0 -169 v -5.5" transform="rotate(-135)" />
      <path d="M 0 -169 v -6.5" transform="rotate(0)" />
      <path d="M 0 -169 v -5.5" transform="rotate(135)" />
    </g>

    <!-- Arc Bed (r=152.5) -->
    <path d="M -107.83 107.83 A 152.5 152.5 0 1 1 107.83 107.83" fill="none" stroke="#111e19" stroke-width="6.5" stroke-linecap="round" />

    <!-- Emissive Fluor Green Arc Fill (true GPU Gaussian drop-shadow glow) -->
    <path class="dial-arc-active" d="M -107.83 107.83 A 152.5 152.5 0 1 1 107.83 107.83" fill="none" stroke="url(#fluor-arc)" stroke-width="6.5" stroke-linecap="round" pathLength="100" />

    <!-- Tactile Bed (.jh-dial__bed: r=140) -->
    <circle cx="0" cy="0" r="140" fill="url(#dial-bed)" stroke="url(#bed-rim)" stroke-width="2" />

    <!-- Tactile Knob (.jh-dial__knob: r=90) with true GPU contact shadow -->
    <g class="dial-knob-shadow">
      <!-- Physical extruded base skirt -->
      <circle cx="0" cy="7" r="90" fill="#040806" />

      <!-- Main cylindrical knob body -->
      <circle cx="0" cy="0" r="90" fill="url(#dial-knob-body)" stroke="url(#knob-top-rim)" stroke-width="1.5" />
    </g>

    <!-- Recessed / beveled Top Cap (.jh-dial__top) -->
    <ellipse cx="0" cy="-2" rx="80" ry="78" fill="url(#dial-top-cap)" stroke="#050a08" stroke-opacity="0.7" stroke-width="1.5" />
    <ellipse cx="0" cy="-2" rx="78.5" ry="76.5" fill="none" stroke="#f5f5ef" stroke-opacity="0.035" stroke-width="1" />

    <!-- Rotating Indicator Light (.jh-dial__mark: true capsule GPU drop-shadow glow) -->
    <g class="dial-indicator" transform="translate(0, -2)">
      <rect x="-3.75" y="-64" width="7.5" height="34" rx="3.75" fill="url(#led-pill-core)" class="dial-led-glow" />
    </g>
  </g>
</svg>
