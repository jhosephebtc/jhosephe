<!doctype html>
<html lang="en" class="dark" data-jh-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacking DAO — Tactile Dial SVG Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'Aktiv Grotesk Ex';
        src: url('./Aktiv_Grotesk_Ex_Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070c0a;
        color: #f5f5ef;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .stage {
        width: min(1200px, 100%);
        border-radius: 24px;
        overflow: hidden;
      }

      .stage object,
      .stage img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <object
        data="./stacking-dao-tactile-dial.svg"
        type="image/svg+xml"
        aria-label="Stacking DAO Tactile Dial SVG Animation"
      ></object>
    </main>
  </body>
</html>
